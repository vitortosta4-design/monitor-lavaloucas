name: Verificar preço da lava-louças

on:
  schedule:
    # Roda 3x por dia. Horários em UTC (Brasília = UTC-3):
    # 09h UTC = 06h Brasília | 15h UTC = 12h Brasília | 21h UTC = 18h Brasília
    - cron: "0 9,15,21 * * *"
  workflow_dispatch: # permite clicar em "Run workflow" no GitHub pra testar na hora

jobs:
  verificar-preco:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Instalar navegador do Playwright
        run: playwright install --with-deps chromium

      - name: Rodar o monitor de preço
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_DESTINO: ${{ secrets.EMAIL_DESTINO }}
          NTFY_TOPICO: ${{ secrets.NTFY_TOPICO }}
          PRECO_ALVO: "5390"
        run: python monitor_preco.py
